site_name: eolas
site_description: Python (eolas-data) and R (eolas) clients for the eolas.nz data API
site_url: https://docs.eolas.nz
repo_url: https://github.com/phildonovan/eolas-data
repo_name: eolas-data

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: blue
    accent: blue
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

nav:
